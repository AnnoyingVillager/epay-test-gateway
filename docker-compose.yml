# 单文件部署：无需 clone 源码，也无需 .env。
# 下载后直接修改下方参数，然后运行：docker compose up -d
# 管理面板：http://localhost:3001/admin
services:
  epay:
    image: ghcr.io/annoyingvillager/epay-test-gateway:latest
    container_name: epay-test-gateway
    pull_policy: always
    init: true
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口。只改冒号左侧即可使用其他外部端口。
      - "3001:3001"
    environment:
      NODE_ENV: "production"
      HOST: "0.0.0.0"
      PORT: "3001"
      DB_PATH: "/app/data/epay.db"

      # 对外访问地址。直接使用 IP/域名访问时可留空自动识别。
      BASE_URL: ""

      # 修改为强管理员密码。
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-me-now"
      ADMIN_SESSION_HOURS: "12"

      # 必改：使用 64 位随机十六进制字符串，否则重启后已加密卡数据无法解密。
      APP_SECRET: "replace-with-a-long-random-secret"

      # 首次启动时创建默认商户；数据库已存在后请在管理面板中修改。
      DEFAULT_MERCHANT_PID: "1001"
      DEFAULT_MERCHANT_NAME: "Demo Merchant"
      DEFAULT_MERCHANT_KEY: "replace-with-a-random-merchant-key"

      # 默认订单超时与异步回调设置。
      ORDER_TIMEOUT_SECONDS: "900"
      NOTIFY_RETRY_COUNT: "3"
      NOTIFY_TIMEOUT_MS: "8000"

      # 反向代理与 HTTPS 部署设置。
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
    volumes:
      - epay_data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  epay_data:
    name: epay_test_gateway_data
